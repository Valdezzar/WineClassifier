services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    environment:
      API_URL: http://api:8000/predict
    ports:
      - "8501:8501"
    depends_on:
      - api
